name: Release We1ssBoard Android app

# Builds the signed APK for every panel version tag and attaches it to that
# release; pull requests touching the app build it as a downloadable artifact.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-release.yml"
      - ".github/scripts/android-smoke.py"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci

      - name: Stamp the panel version
        run: |
          version="$(tr -d '[:space:]' < ../internal/config/version)"
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          jq --arg v "$version" --argjson c "$code" \
            '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign with the We1ssBoard key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [[ -n "$KEYSTORE_B64" ]] || { echo "ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          out="we1ssboard-android-${APP_VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASSWORD "$out"
          "$apksigner" verify --print-certs "$out" | grep -i "certificate DN"
          sha256sum "$out" > "$out.sha256"
          rm -f "$RUNNER_TEMP/release.p12"
          echo "APK=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: we1ssboard-android
          path: |
            mobile/${{ env.APK }}
            mobile/${{ env.APK }}.sha256

      # release.yml publishes the tag's release once every panel build is done.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for _ in $(seq 1 120); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
              exit 0
            fi
            sleep 30
          done
          echo "release $TAG did not appear within an hour"; exit 1

  # Installs the built APK on an emulator, signs in to a real panel and opens
  # every tab; a release APK that crashes is otherwise only found by users.
  smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: we1ssboard-android
          path: apk

      - name: Start a panel for the app to sign in to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "we1ssboard-linux-amd64.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/we1ssboard-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          panel="$RUNNER_TEMP/we1ssboard"
          mkdir -p "$panel/db"
          export XUI_DB_FOLDER="$panel/db" XUI_LOG_FOLDER="$panel/db" XUI_BIN_FOLDER="$panel/bin"
          token="$("$panel/we1ssboard" setting -getApiToken | sed -n "s/^apiToken: //p")"
          [[ -n "$token" ]] || { echo "no API token"; exit 1; }
          nohup "$panel/we1ssboard" run > "$RUNNER_TEMP/panel.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:2053/ && break; sleep 2; done
          echo "PANEL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Sign in and open every screen on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PANEL_URL: http://10.0.2.2:2053
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            python3 .github/scripts/android-smoke.py

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: we1ssboard-android-smoke
          path: smoke/
